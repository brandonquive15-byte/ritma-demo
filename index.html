<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso privado · Ritma</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#08090B">

<style>
  :root{--bg:#08090B;--ink:#EDEFF2;--muted:#9AA2AB;--dim:#7E8792;--line:rgba(255,255,255,.085);--jade:#6FD3AE;--danger:#E4736B}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:24px;
    font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:
      radial-gradient(900px 520px at 78% -10%, rgba(111,211,174,.13), transparent 62%),
      radial-gradient(800px 460px at 6% 6%, rgba(228,176,105,.09), transparent 60%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:400px;padding:34px 30px;border-radius:24px;
    border:1px solid var(--line);
    background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.016));
    box-shadow:0 30px 80px -40px #000;backdrop-filter:blur(18px);
    animation:in .5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mark{
    width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:22px;
    background:linear-gradient(150deg,rgba(111,211,174,.22),rgba(255,255,255,.03));
    border:1px solid rgba(111,211,174,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  }
  .eyebrow{font-size:.68rem;letter-spacing:.19em;text-transform:uppercase;color:var(--jade);margin:0 0 10px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:1.75rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}
  p.sub{color:var(--muted);font-size:.9rem;margin:0 0 26px;line-height:1.55}
  label{display:block;font-size:.76rem;color:var(--muted);margin:0 0 6px;letter-spacing:.03em}
  .field{margin-bottom:14px}
  input{
    width:100%;font:inherit;font-size:.94rem;padding:12px 13px;border-radius:10px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);
    transition:border-color .2s,background .2s;
  }
  input:focus{outline:none;border-color:rgba(111,211,174,.55);background:rgba(111,211,174,.05)}
  input[aria-invalid="true"]{border-color:rgba(228,115,107,.6)}
  button{
    width:100%;font:inherit;font-size:.94rem;font-weight:600;margin-top:8px;padding:13px;
    border:0;border-radius:999px;cursor:pointer;color:#04110C;
    background:linear-gradient(180deg,#8FE3C2,#5FC49E);
    box-shadow:0 14px 34px -14px rgba(111,211,174,.6), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .2s,opacity .2s;
  }
  button:hover:not(:disabled){transform:translateY(-1px)}
  button:disabled{opacity:.6;cursor:progress;transform:none}
  .msg{min-height:20px;font-size:.8rem;color:var(--danger);margin-top:14px}
  .fine{font-size:.7rem;color:var(--dim);margin-top:18px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
  :focus-visible{outline:2px solid var(--jade);outline-offset:3px}
  @media(max-height:720px){.card{padding:26px 24px}.mark{margin-bottom:16px}h1{font-size:1.55rem}p.sub{margin-bottom:20px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD3AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  </div>
  <p class="eyebrow">Demo privada</p>
  <h1>Entra con tu acceso</h1>
  <p class="sub">Esta demo está cifrada. Necesitas el usuario y la contraseña que te compartieron.</p>
  <form id="f" autocomplete="on" novalidate>
    <div class="field">
      <label for="u">Usuario</label>
      <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="p">Contraseña</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button id="go" type="submit">Entrar a la demo</button>
    <p class="msg" id="m" role="alert" aria-live="polite"></p>
  </form>
  <p class="fine">El contenido se descifra en tu navegador; no se envía a ningún servidor. Recargar la página vuelve a pedir el acceso.</p>
</main>

  const ITER = 310000;
  const $ = s => document.querySelector(s);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  // descifrado perezoso: el HTML no está en el documento hasta acertar
  async function unlock(user, pass) {
    const raw = b64(B64);
    const iv = raw.slice(0, 12), tag = raw.slice(12, 28), data = raw.slice(28);
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(user + '\u0000' + pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64('ShFxdH/iJgjg1bz0rfcFBg=='), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const buf = new Uint8Array(data.length + tag.length);
    buf.set(data); buf.set(tag, data.length);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, tagLength: 128 }, key, buf);
    return new TextDecoder().decode(plain);
  }

  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    const u = $('#u').value.trim(), p = $('#p').value;
    const btn = $('#go'), msg = $('#m');
    msg.textContent = '';
    if (!u || !p) { msg.textContent = 'Escribe usuario y contraseña.'; return; }
    btn.disabled = true; btn.textContent = 'Verificando…';
    try {
      const html = await unlock(u, p);
      document.open(); document.write(html); document.close();
    } catch {
      btn.disabled = false; btn.textContent = 'Entrar a la demo';
      $('#u').setAttribute('aria-invalid', 'true');
      $('#p').setAttribute('aria-invalid', 'true');
      msg.textContent = 'Usuario o contraseña incorrectos.';
      $('#p').select();
    }
  });
})();
